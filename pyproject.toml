[project]
name = "ia-remodelada"
version = "1.0.0"
description = "Agente local inteligente com plugins, turbo mode, ensemble de modelos, RAG e sandbox."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "PyPDF2>=3.0.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "mutagen>=1.47.0",
    "dnspython>=2.6.0",
    "whois>=0.9.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout", "pytest-asyncio", "flake8", "bandit"]
playwright = ["playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
